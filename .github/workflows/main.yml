name: Futmondo BOT - Extracción Diaria

on:
  schedule:
    - cron: '0 5,6 * * *'
  workflow_dispatch: # Permite la ejecución manual

# ⚠️ Permisos necesarios para que el bot pueda escribir (git push) en tu repositorio
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4 # ⬆️ ACTUALIZADO A v4 para evitar warnings de Node.js

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5 # ⬆️ ACTUALIZADO A v5 para evitar warnings de Node.js
        with:
          python-version: '3.10'

      - name: 🕒 Comprobar Horario (o Ejecución Manual)
        id: time_check
        run: |
          HORA_ESP=$(TZ='Europe/Madrid' date +%H)
          echo "La hora actual en España es: $HORA_ESP:00"
          echo "Evento disparador: ${{ github.event_name }}"
          
          # Si le has dado al botón manual, O si son las 07:00 AM, damos luz verde
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "$HORA_ESP" == "07" ]; then
            echo "hora_correcta=true" >> $GITHUB_OUTPUT
            echo "🟢 Ejecución autorizada (Manual o Horario Correcto)."
          else
            echo "hora_correcta=false" >> $GITHUB_OUTPUT
            echo "⚠️ Saltando ejecución automática porque no son las 07:00 AM local."
          fi

      - name: 🛡️ Validar si la Temporada está Activa
        id: validador
        if: steps.time_check.outputs.hora_correcta == 'true'
        env:
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
        run: python scripts/validador_temporada.py

      - name: 📦 Instalar librerías
        if: steps.validador.outputs.activa == 'true'
        run: pip install pandas openpyxl requests python-dotenv

      - name: 🚀 Ejecutar Extracción Completa (ETL)
        if: steps.validador.outputs.activa == 'true'
        env:
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
        run: |
          python scripts/md_propietarios.py
          python scripts/md_jugadores.py
          python scripts/md_equipos.py
          python scripts/md_partidos.py
          python scripts/td_rendimiento.py
          python scripts/td_jugadores.py
          python scripts/td_admin.py
          
      - name: 💾 Subir cambios a GitHub
        if: steps.validador.outputs.activa == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add datos/
          git commit -m "🤖 [BOT] Extracción completada" || echo "No hay cambios para hacer commit"
          git push