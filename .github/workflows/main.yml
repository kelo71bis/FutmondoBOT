name: Futmondo BOT - Extracción Diaria

on:
  schedule:
    - cron: '*/5 * * * *' # ⏱️ PARA PRUEBAS: Se ejecuta cada 5 minutos
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🕒 Comprobar Horario (MODO PRUEBA ACTIVADO)
        id: time_check
        run: |
          HORA_ESP=$(TZ='Europe/Madrid' date +%H:%M)
          echo "La hora actual en España es: $HORA_ESP"
          echo "Evento disparador: ${{ github.event_name }}"
          
          # 🛑 CANDADO DESACTIVADO PARA LA PRUEBA
          # Forzamos que siempre devuelva 'true' para que no bloquee la ejecución de tarde
          echo "hora_correcta=true" >> $GITHUB_OUTPUT
          echo "🟢 Ejecución de prueba autorizada."

      - name: 📦 Instalar librerías
        if: steps.time_check.outputs.hora_correcta == 'true'
        run: pip install pandas openpyxl requests python-dotenv

      - name: 🛡️ Validar si la Temporada está Activa
        id: validador
        if: steps.time_check.outputs.hora_correcta == 'true'
        env:
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
        run: python scripts/validador_temporada.py

      - name: 🚀 Ejecutar Extracción Completa (ETL)
        if: steps.validador.outputs.activa == 'true'
        env:
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
        run: |
          python scripts/md_propietarios.py
          python scripts/md_jugadores.py
          python scripts/md_equipos.py
          python scripts/md_partidos.py
          python scripts/td_rendimiento.py
          python scripts/td_jugadores.py
          python scripts/td_admin.py
          python scripts/td_puntos_jugadores.py
          python scripts/crear_vista_global.py
          
      - name: 💾 Subir cambios a GitHub
        if: steps.validador.outputs.activa == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add datos/
          git commit -m "🤖 [BOT] Extracción de PRUEBA completada" || echo "No hay cambios para hacer commit"
          git push