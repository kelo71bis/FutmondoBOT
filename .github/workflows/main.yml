name: Futmondo BOT - Extracción Diaria

on:
  schedule:
    # Se ejecuta todos los días a las 23:00 UTC (01:00 AM hora española de verano)
    - cron: '0 23 * * *'
  workflow_dispatch: # Permite ejecución manual por si acaso

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          pip install pandas openpyxl requests python-dotenv

      - name: Ejecutar Extracción de Datos Maestros
        env:
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
        run: |
          python md_propietarios.py
          
      - name: Subir cambios a GitHub
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add datos/maestros/md_propietarios.xlsx
          git commit -m "🤖 [BOT] Maestro de Propietarios actualizado (TRUNCATE)" || echo "No hay cambios para hacer commit"
          git push
