name: Futmondo BOT - Extracción Diaria

on:
  schedule:
    - cron: '0 5,6 * * *' # 07:00 y 08:00 hora España
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar librerías
        run: pip install pandas openpyxl requests python-dotenv

      - name: 🚀 Ejecutar Extracción Completa (ETL)
        env:
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
        run: |
          # Se ejecutan todos los scripts uno tras otro
          python scripts/md_propietarios.py
          python scripts/md_jugadores.py
          python scripts/md_equipos.py
          python scripts/md_partidos.py
          python scripts/td_rendimiento.py
          python scripts/td_jugadores.py
          python scripts/td_admin.py
          python scripts/td_puntos_jugadores.py
          python scripts/crear_vista_global.py
          
      - name: 💾 Subir cambios a GitHub
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "🤖 [BOT] Actualización automática diaria" || echo "Sin cambios"
          git push