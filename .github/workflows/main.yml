name: Futmondo BOT - Extracción Diaria

on:
  schedule:
    - cron: '25 18 * * *' # ⏱️ 18:25 UTC = 20:25 en España
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🕒 Comprobar Horario (PRUEBA 20:25)
        id: time_check
        run: |
          HORA_ESP=$(TZ='Europe/Madrid' date +%H)
          echo "La hora actual en España es: $HORA_ESP:00"
          echo "Evento disparador: ${{ github.event_name }}"
          
          # Permitimos ejecución manual, o si son las 07, 08 o 20 (PARA ESTA PRUEBA)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "$HORA_ESP" == "07" ] || [ "$HORA_ESP" == "08" ] || [ "$HORA_ESP" == "20" ]; then
            echo "hora_correcta=true" >> $GITHUB_OUTPUT
            echo "🟢 Ejecución autorizada."
          else
            echo "hora_correcta=false" >> $GITHUB_OUTPUT
            echo "⚠️ Saltando ejecución automática."
          fi

      - name: 📦 Instalar librerías
        if: steps.time_check.outputs.hora_correcta == 'true'
        run: pip install pandas openpyxl requests python-dotenv

      - name: 🛡️ Validar si la Temporada está Activa
        id: validador
        if: steps.time_check.outputs.hora_correcta == 'true'
        env:
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
        run: python scripts/validador_temporada.py

      - name: 🚀 Ejecutar Extracción Completa (ETL)
        # 🛑 HEMOS QUITADO LA RESTRICCIÓN DEL VALIDADOR AQUÍ
        if: steps.time_check.outputs.hora_correcta == 'true'
        env:
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
        run: |
          python scripts/md_propietarios.py
          python scripts/md_jugadores.py
          python scripts/md_equipos.py
          python scripts/md_partidos.py
          python scripts/td_rendimiento.py
          python scripts/td_jugadores.py
          python scripts/td_admin.py
          python scripts/td_puntos_jugadores.py
          python scripts/crear_vista_global.py
          
      - name: 💾 Subir cambios a GitHub
        # 🛑 HEMOS QUITADO LA RESTRICCIÓN DEL VALIDADOR AQUÍ
        if: steps.time_check.outputs.hora_correcta == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add datos/
          git commit -m "🤖 [BOT] Extracción completada" || echo "No hay cambios para hacer commit"
          git push