name: Futmondo BOT - Extracción Diaria

on:
  schedule:
    - cron: '0 5,6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🕒 Comprobar Horario de España
        id: time_check
        run: |
          HORA_ESP=$(TZ='Europe/Madrid' date +%H)
          if [ "$HORA_ESP" == "07" ]; then
            echo "hora_correcta=true" >> $GITHUB_OUTPUT
          else
            echo "hora_correcta=false" >> $GITHUB_OUTPUT
          fi

      - name: 🛡️ Validar Temporada Activa
        id: validador
        if: steps.time_check.outputs.hora_correcta == 'true'
        env:
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
        run: python scripts/validador_temporada.py

      - name: Instalar librerías
        if: steps.validador.outputs.activa == 'true'
        run: pip install pandas openpyxl requests python-dotenv

      - name: Ejecutar Extracción Completa
        if: steps.validador.outputs.activa == 'true'
        env:
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
        run: |
          python scripts/md_propietarios.py
          python scripts/md_jugadores.py
          python scripts/md_equipos.py
          python scripts/md_partidos.py
          python scripts/td_jugadores.py
          
      - name: Subir cambios a GitHub
        if: steps.validador.outputs.activa == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add datos/
          git commit -m "🤖 [BOT] Carga diaria automatizada" || echo "No hay cambios"
          git push